name: Deploy

# Template deploy config - NOT wired to any live target out of the box.
# GitHub Pages deploys once Pages is enabled on the repo. Cloudflare Pages is
# opt-in: set a repository variable `CF_PROJECT` (Settings -> Secrets and
# variables -> Actions -> Variables) to your Cloudflare Pages project name and
# add the `CLOUDFLARE_API_TOKEN` / `CLOUDFLARE_ACCOUNT_ID` secrets; the
# `deploy-cf-pages` job then runs automatically. Leave `CF_PROJECT` unset to
# deploy to GitHub Pages only. Run manually via the Actions tab ("Run workflow").

on:
  # Manual only - no longer triggers on push to main. Run via the Actions
  # tab ("Run workflow") when a deploy is desired.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload dist for CF
        if: ${{ vars.CF_PROJECT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-cf
          path: dist

  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cf-pages:
    needs: build
    if: ${{ vars.CF_PROJECT != '' }}
    runs-on: ubuntu-latest
    environment: cf-deploy
    env:
      CF_PROJECT: ${{ vars.CF_PROJECT }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-cf
          path: dist

      - name: Create Pages project if not exists
        run: npx wrangler pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name="$CF_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
