name: Examples consistency check

# Drift guard for the examples/ sample repos (nimbus templates-check in
# miniature): verifies each examples/*/skills/site-content-sync/ copy is
# byte-identical to the canonical tree (examples/_shared/site-content-sync/),
# that .github/workflows/sync-*.yml matches what the generator produces, and
# that each example's content passes its own validator. See
# .agents/plan/examples-consistency.plan.
#
# Runs `npm run check:examples` - pure Node stdlib, no npm ci / astro build,
# which keeps this job cheap.
#
# Drift gating on pull requests: any PR touching the canonical skill tree,
# the sync generator, or the examples themselves must keep the per-example
# copies in sync, or this job fails. Manual runs stay available via
# workflow_dispatch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'skills/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check examples consistency
        run: npm run check:examples
